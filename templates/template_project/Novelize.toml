[metadata]
name = "novelize"
stylized-name = "Novelize"
version = "0.1.0"

# This lists out _RELATIVE_ paths to things. Everything's required. No path can
# go underneath this directory.
[paths]
game = "game"
# Loaded into the model's context for storyboard/narrative generation.
context-narrative = [
    "context-narrative.txt",
]
# Loaded into the model's context for scene/dialogue generation.
context-dialogue = [
    "context-dialogue.txt",
]